<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>山海灵境 · 交互回归</title><style>body{font:15px system-ui;background:#eff0e7;color:#243c30;margin:24px}main{display:flex;gap:24px}iframe{width:390px;height:844px;border:1px solid #ccc}button{padding:10px 20px}pre{white-space:pre-wrap;max-width:600px}.pass{color:#286b51}.fail{color:#a32929}</style><h1>新版交互回归</h1><button id="run">运行全部检查</button><main><pre id="report">准备就绪后点击运行。仅使用本地独立测试战局。</pre><iframe id="game" src="../?test=1"></iframe></main><script type="module">
const report=document.querySelector('#report'),iframe=document.querySelector('#game');
document.querySelector('#run').onclick=async()=>{
 let pass=0,fail=0,logs=[];
 const w=iframe.contentWindow,d=w.document,t=w.__MOJING__;
 const check=(name,fn)=>{try{fn();pass++;logs.push('✓ '+name);}catch(e){fail++;logs.push('✗ '+name+'：'+e.message);}report.textContent=logs.join('\n');};
 const assert=(v,m='结果不符')=>{if(!v)throw Error(m);};
 const setup=()=>{t.start({size:'small',opponents:2,seed:73129,autoPlayer:false});t.game.factions.forEach(f=>f.nextThink=Infinity);return t.game;};
 const canvas=d.querySelector('canvas');
 const p=id=>t.renderer.screen(t.game.nodes[id]);
 const event=(type,q,id=1)=>{const r=canvas.getBoundingClientRect();canvas.dispatchEvent(new w.PointerEvent(type,{bubbles:true,pointerId:id,pointerType:'touch',isPrimary:id===1,clientX:q.x+r.x,clientY:q.y+r.y,buttons:type==='pointerup'?0:1}));};
 // Synthetic pointer events do not establish browser pointer capture. Keep capture bookkeeping out of this harness.
 const capture=canvas.setPointerCapture;canvas.setPointerCapture=()=>{};
 const drag=(from,to)=>{event('pointerdown',from);event('pointermove',{x:from.x+6,y:from.y});event('pointermove',to);event('pointerup',to);};
 const loop=(ids,release=true)=>{const ps=ids.map(p),center={x:ps.reduce((s,p)=>s+p.x,0)/ps.length-(ids.length===1?45:0),y:ps.reduce((s,p)=>s+p.y,0)/ps.length-35},radius=Math.max(...ps.map(p=>Math.hypot(p.x-center.x,p.y-center.y)))+10,edge={x:center.x+radius,y:center.y};event('pointerdown',center);event('pointermove',edge);if(release)event('pointerup',edge);};
 check('轻划立即御灵：同一时刻按下、移动、松手，无长按等待',()=>{const g=setup();drag(p(9),p(10));assert(g.armies.length===1);assert(g.armies[0].power===20);});
 check('点击仅查看详情，不误发灵',()=>{const g=setup();event('pointerdown',p(10));event('pointerup',p(10));assert(t.selection===10&&g.armies.length===0);});
 check('空白松手取消御灵，不扣灵',()=>{const g=setup();drag(p(9),{x:190,y:15});assert(g.armies.length===0&&g.nodes[9].power===40);});
 check('拉出圆形选区，松手后从任意选中古树拖向目标，两树齐发',()=>{const g=setup();g.nodes[10].owner=0;g.nodes[10].power=40;loop([9,10]);assert(t.renderer.group.size===2,'未选中两树');drag(p(9),p(11));assert(g.armies.length===2);assert(g.nodes[9].power>=8&&g.nodes[10].power>=8);});
 check('圆心固定，拖远放大、拖近缩小，选区随半径变化',()=>{const g=setup();g.nodes[10].owner=0;const a=p(9),b=p(10),center={x:a.x-34,y:a.y-28};event('pointerdown',center);event('pointermove',{x:center.x+Math.hypot(b.x-center.x,b.y-center.y)+10,y:center.y});assert(t.renderer.group.size===2);event('pointermove',{x:center.x+46,y:center.y});assert(t.renderer.group.size===1&&t.renderer.group.has(9));assert(t.renderer.selectionCircle.center.x===center.x);event('pointerup',{x:center.x+46,y:center.y});assert(t.renderer.selectionCircle.locked);});
 check('圈内空白直接拖动出兵，不必寻找树心，兵数不再乘比例',()=>{const g=setup();loop([9]);const c=t.renderer.selectionCircle.center,amount=t.renderer.spiritSelection.get(9).size;assert(!t.renderer.nodeAt(c),'起点必须为空白');drag(c,p(10));assert(g.armies.length===1&&g.armies[0].power===amount*4);assert(t.renderer.selectionCircle===null);});
 check('圈住树旁一部分墨灵即可选择，树心无需在圈内',()=>{setup();const a=p(9),center={x:a.x-38,y:a.y+10},edge={x:center.x+23,y:center.y};event('pointerdown',center);event('pointermove',edge);event('pointerup',edge);const selected=t.renderer.spiritSelection.get(9);assert(selected?.size>0&&selected.size<8,'应只选中部分墨灵');assert(Math.hypot(a.x-center.x,a.y-center.y)>23,'树心不在圈内');});
 check('保留的圈可从边缘再次调整大小',()=>{setup();loop([9]);const c=t.renderer.selectionCircle,edge={x:c.center.x+c.radius,y:c.center.y};drag(edge,{x:c.center.x+c.radius+25,y:c.center.y});assert(t.renderer.selectionCircle.radius>c.radius&&t.renderer.selectionCircle.locked);});
 check('圈选松手后点击目标也能齐发',()=>{const g=setup();g.nodes[10].owner=0;g.nodes[10].power=40;loop([9,10]);event('pointerdown',p(11));event('pointerup',p(11));assert(g.armies.length===2);});
 check('圈选不会选中敌军或中立树',()=>{setup();loop([9,10]);assert(t.renderer.group.size===1&&t.renderer.group.has(9));});
 check('圈选后空白轻点清空选中',()=>{setup();loop([9]);event('pointerdown',{x:190,y:15});event('pointerup',{x:190,y:15});assert(t.renderer.group.size===0);});
 check('系统取消触摸不发灵，清除连线',()=>{const g=setup();event('pointerdown',p(9));event('pointermove',p(10));event('pointercancel',p(10));assert(g.armies.length===0&&t.renderer.drag===null);});
 check('双指缩放中断御灵，不意外下令',()=>{const g=setup();event('pointerdown',p(9));event('pointermove',p(10));event('pointerdown',{x:50,y:50},2);event('pointerup',p(10));event('pointerup',{x:50,y:50},2);assert(g.armies.length===0&&t.renderer.drag===null);});
 check('100% 出灵仍保留两名驻灵',()=>{const g=setup(),r=d.querySelector('#ratio');r.value=100;r.dispatchEvent(new w.Event('input',{bubbles:true}));drag(p(9),p(10));assert(g.nodes[9].power===8&&g.armies[0].power===32);});
 check('半数快捷出灵仍可用',()=>{const g=setup();d.querySelector('#half-button').click();event('pointerdown',p(10));event('pointerup',p(10));assert(g.armies.length===1&&g.armies[0].power===20);});
 check('点击卡牌后古树施放，不误触御灵',()=>{const g=setup();g.nodes[9].power=8;d.querySelector('[data-card="recruit"]').click();event('pointerdown',p(9));event('pointerup',p(9));assert(g.nodes[9].power===48&&g.armies.length===0);});
 check('卡牌取消保留手牌',()=>{const g=setup();d.querySelector('[data-card="guard"]').click();d.querySelector('#cancel-target').click();assert(g.factions[0].hand.length===3&&t.card===null);});
 check('古树升级可用且扣除灵力',()=>{const g=setup();d.querySelector('#upgrade-button').click();assert(g.nodes[9].upgrade&&g.nodes[9].power===8);});
 check('设置暂停与继续',()=>{setup();d.querySelector('#settings-button').click();assert(t.paused);d.querySelector('#resume-game').click();assert(!t.paused);});
 check('退出确认可返回与重选',()=>{setup();d.querySelector('#exit-button').click();d.querySelector('#exit-continue').click();assert(!t.paused);d.querySelector('#exit-button').click();d.querySelector('#exit-confirm').click();assert(!!d.querySelector('#start-game'));});
 check('最后一树失守出现失败结算',()=>{const g=setup();g.nodes[9].owner=1;t.advance(.1);assert(g.status==='defeat');});
 check('全部古树归属玩家时判胜',()=>{const g=setup();g.nodes.forEach(n=>n.owner=0);t.advance(.1);assert(g.status==='victory');});
 check('各地图三 AI 均能渲染',()=>{for(const size of ['small','medium','large']){t.start({size,opponents:3,seed:73129});t.renderer.resize();t.renderer.draw(performance.now());assert(t.game.nodes.length==={small:12,medium:18,large:24}[size]);}});
 await Promise.all([t.renderer.backdrop.decode(),t.renderer.atlas.decode()]);
 check('山海古林与墨灵素材加载成功',()=>{assert(t.renderer.backdrop.naturalWidth>500&&t.renderer.atlas.naturalWidth>500);});
 canvas.setPointerCapture=capture;setup();
 report.textContent=logs.join('\n')+`\n\n${pass} 项通过，${fail} 项失败。`;
 report.className=fail?'fail':'pass';document.body.dataset.result=fail?'failed':'passed';
};
</script></html>
